# Secciones agregadas al final de /etc/samba/smb.conf — srv-epa
[empresa]
   comment = Archivos compartidos EPA
   path = /srv/samba/empresa
   browseable = yes
   writable = yes
   guest ok = no
   valid users = @sambausers
   force group = sambausers
   create mask = 0660
   directory mask = 2770

[gerencia]
   comment = Carpeta privada de Gerencia
   path = /srv/samba/gerencia
   browseable = yes
   writable = yes
   guest ok = no
   valid users = gerente
